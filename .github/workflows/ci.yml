name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Free disk space # the CUDA torch install in the image needs room
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
    - name: Build image
      run: docker build -t humanoid-dev docker
    - name: Check ROS and MuJoCo
      run: docker run --rm humanoid-dev python3 -c "import rclpy, mujoco, os; print('ROS', os.environ['ROS_DISTRO'], '| MuJoCo', mujoco.__version__)"
    - name: Check mjlab
      run: docker run --rm humanoid-dev /opt/mjlab/bin/python -c "import mjlab, mujoco_warp; print('mjlab OK')"
