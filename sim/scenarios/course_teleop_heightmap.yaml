# The competition course with the team's terrain-aware walker (G1-Rough-HeightMap, as in course_ramps_heightmap),
# driven by a person (ros2_ws/src/teleop). It starts on the open deck facing the crossing ramps (+x): in the start
# area or the step-over section its scan takes in walls it never trained on, and it falls while standing.
# Run: ros2 launch bringup g1.launch.py scenario:=course_teleop_heightmap
scene: sim/g1_course_scene.xml
spawn: {x: 5.3, y: 4.55, yaw: 0.0}
duration: 3600.0
policy:
  type: rsl_rl_g1_heightmap
  checkpoint: training/models/best_g1_rough_heightmap/model_5996.pt
  scan: true_terrain                   # or elevation_map, the live map as on the robot
motion:
  type: operator                       # the sim publishes no /cmd_vel: see bridge/motion.py
on_fall: respawn                       # testing only: SHARE / r stands a fallen robot up where it is
