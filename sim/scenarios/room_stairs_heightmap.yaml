# Up the LiDAR room's four 20 cm steps to the third, then back down, with the G1-Rough-HeightMap walker.
# scan:=elevation_map feeds it the live elevation map instead of the true terrain.
scene: sim/g1_walk_scene.xml
spawn: {x: 3.6, y: 2.5, yaw: 0.0}
duration: 60.0
policy:
  type: rsl_rl_g1_heightmap
  checkpoint: training/models/best_g1_rough_heightmap/model_5996.pt
  scan: true_terrain                               # or elevation_map
motion:
  type: waypoints
  speed: 0.4
  points: [[6.0, 2.5], [3.4, 2.5]]
